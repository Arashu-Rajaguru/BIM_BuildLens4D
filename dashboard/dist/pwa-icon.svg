<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#182234"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- 4D Digital Twin Cube / Holographic BIM Geometry -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="256,96 396,176 256,256 116,176" fill="url(#primary)" opacity="0.95"/>
    
    <!-- Left Face -->
    <polygon points="116,176 256,256 256,416 116,336" fill="#0369a1" opacity="0.85"/>
    
    <!-- Right Face -->
    <polygon points="256,256 396,176 396,336 256,416" fill="url(#accent)" opacity="0.9"/>
  </g>

  <!-- Geometric Grid Lines -->
  <line x1="256" y1="256" x2="256" y2="416" stroke="#f8fafc" stroke-width="4" stroke-dasharray="8,6" opacity="0.7"/>
  <line x1="256" y1="256" x2="396" y2="176" stroke="#f8fafc" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="256" x2="116" y2="176" stroke="#f8fafc" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="96" x2="256" y2="256" stroke="#f8fafc" stroke-width="4" opacity="0.8"/>

  <!-- Center AR Pulse Sensor Node -->
  <circle cx="256" cy="256" r="14" fill="#f8fafc" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="26" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75"/>

  <!-- 4D Sub-Badge -->
  <rect x="310" y="380" width="120" height="48" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
  <text x="370" y="414" fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle">4D</text>
</svg>
